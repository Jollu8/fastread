<!DOCTYPE html>
<html lang="ru" data-theme="oled">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Speed Reader — RSVP</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --fg: #f5f5f7;
      --muted: #8e8e93;
      --card: rgba(255, 255, 255, .075);
      --control: rgba(44, 44, 46, .72);
      --accent: #ff3b30;
      --border: rgba(255, 255, 255, .11);
      --field: rgba(118, 118, 128, .22);
    }

    html[data-theme="midnight"] {
      --bg: #0a0e1a;
      --card: rgba(255, 255, 255, .07);
      --control: rgba(25, 30, 45, .78);
    }

    html[data-theme="grey"] {
      --bg: #1c1c1e;
      --card: rgba(255, 255, 255, .075);
      --control: rgba(44, 44, 46, .78);
    }

    html[data-theme="paper"] {
      color-scheme: light;
      --bg: #f2f2f7;
      --fg: #1c1c1e;
      --muted: #6e6e73;
      --card: rgba(255, 255, 255, .72);
      --control: rgba(255, 255, 255, .78);
      --border: rgba(60, 60, 67, .14);
      --field: rgba(120, 120, 128, .12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-width: 280px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Helvetica Neue", sans-serif;
      transition: background-color .2s ease, color .2s ease;
    }

    button, input, select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .setup-screen {
      width: min(100%, 520px);
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      overflow-y: auto;
    }

    .title {
      margin: 0 0 4px;
      font-size: clamp(27px, 8vw, 34px);
      font-weight: 720;
      letter-spacing: -.8px;
      text-align: center;
    }

    .subtitle {
      margin: -12px 0 2px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .card, .resume-banner {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
    }

    .card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .card-title, .range-heading {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .file-row, .range-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .file-name {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .file-btn, .start-btn, .resume-btn {
      min-height: 46px;
      padding: 12px 16px;
      border: 0;
      border-radius: 13px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
    }

    .file-btn {
      width: 100%;
      background: var(--field);
      color: var(--fg);
    }

    .start-btn {
      width: 100%;
      min-height: 50px;
    }

    .range-value {
      color: var(--fg);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      margin: 2px 0;
      accent-color: var(--accent);
    }

    .setting-label {
      display: flex;
      flex-direction: column;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .sound-picker {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sound-picker .select-input {
      min-width: 0;
      flex: 1;
    }

    .preview-btn {
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--field);
      color: var(--fg);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .select-input {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--field);
      color: var(--fg);
      outline-color: var(--accent);
    }

    .select-input option {
      background: var(--bg);
      color: var(--fg);
    }

    .resume-banner {
      padding: 13px 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .resume-banner.visible {
      display: flex;
    }

    .resume-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
    }

    .resume-copy strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .resume-copy span {
      color: var(--muted);
    }

    .resume-btn {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 9px 12px;
      font-size: 13px;
    }

    .status-message {
      min-height: 16px;
      margin: -7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    .reader-screen {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .reader-screen.active {
      display: flex;
    }

    .word-display {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: baseline;
      width: 100%;
      max-width: 100%;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: clamp(26px, 9vw, 58px);
      font-weight: 550;
      letter-spacing: 0;
      line-height: 1.25;
      white-space: pre;
      font-variant-ligatures: none;
    }

    .word-before {
      justify-self: end;
      overflow: hidden;
      text-align: right;
    }

    .word-focus {
      justify-self: center;
      color: var(--accent);
    }

    .word-after {
      justify-self: start;
      overflow: hidden;
      text-align: left;
    }

    .code-card {
      width: min(100%, 900px);
      max-height: min(68dvh, 620px);
      padding: clamp(14px, 4vw, 22px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 16px 60px rgba(0, 0, 0, .24);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      user-select: text;
      -webkit-user-select: text;
    }

    .code-heading {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .code-content {
      max-height: calc(min(68dvh, 620px) - 70px);
      margin: 0;
      overflow: auto;
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(12px, 2.7vw, 15px);
      line-height: 1.65;
      tab-size: 2;
      white-space: pre;
      -webkit-overflow-scrolling: touch;
    }

    .code-keyword { color: #bf9af7; }
    .code-string { color: #a7d98b; }
    .code-comment { color: #8e8e93; font-style: italic; }
    .code-number { color: #ffb86c; }
    .code-function { color: #82cfff; }

    .controls-overlay {
      position: absolute;
      right: 16px;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 16px;
      width: max-content;
      max-width: calc(100% - 32px);
      margin: auto;
      padding: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--control);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .16);
      opacity: 1;
      transition: opacity .25s ease, transform .25s ease;
    }

    .controls-overlay.hidden {
      pointer-events: none;
      opacity: 0;
      transform: translateY(12px);
    }

    .btn-icon {
      min-width: 54px;
      min-height: 44px;
      padding: 9px 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--fg);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-icon:active, .file-btn:active, .start-btn:active, .resume-btn:active {
      transform: scale(.97);
    }

    .reader-progress {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: 22px;
      left: 22px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      opacity: .8;
      pointer-events: none;
    }

    @media (max-height: 700px) {
      .setup-screen {
        justify-content: flex-start;
      }

      .title {
        margin-top: 4px;
      }

      .card {
        padding: 13px;
        gap: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="setup-screen" id="setupScreen">
    <h1 class="title">Speed Reader</h1>
    <p class="subtitle">Читайте в своём ритме</p>

    <section class="card" aria-label="Загрузка текста">
      <span class="card-title">Текстовый файл · TXT, MD или PDF</span>
      <button class="file-btn" id="chooseFileBtn" type="button">Выбрать файл</button>
      <input type="file" id="fileInput" accept=".txt,.md,.markdown,.pdf,text/plain,text/markdown,application/pdf">
      <div class="file-row">
        <span class="card-title">Файл</span>
        <span class="file-name" id="fileName">Не выбран</span>
      </div>
    </section>

    <div class="resume-banner" id="resumeBanner" aria-live="polite">
      <div class="resume-copy">
        <strong id="resumeTitle"></strong>
        <span id="resumeDetails"></span>
      </div>
      <button class="resume-btn" id="resumeBtn" type="button">Продолжить</button>
    </div>

    <section class="card" aria-label="Настройки чтения">
      <div class="range-heading">
        <label for="wpmInput">Скорость</label>
        <span class="range-value"><span id="wpmValue">300</span> WPM</span>
      </div>
      <input type="range" id="wpmInput" min="100" max="800" step="10" value="300">

      <label class="setting-label" for="themeInput">
        Тема оформления
        <select class="select-input" id="themeInput">
          <option value="oled">OLED Black</option>
          <option value="midnight">Midnight</option>
          <option value="grey">Dark Grey</option>
          <option value="paper">Light / Paper</option>
        </select>
      </label>

      <label class="setting-label" for="soundInput">
        Звук на слово
        <span class="sound-picker">
          <select class="select-input" id="soundInput">
            <option value="piano">Мягкое пианино</option>
            <option value="click">Перкуссионный щелчок</option>
            <option value="chime">Мотивирующий колокольчик</option>
            <option value="marimba">Бодрая маримба</option>
            <option value="pulse">Энергичный аккорд</option>
            <option value="off">Без звука</option>
          </select>
          <button class="preview-btn" id="previewSoundBtn" type="button" aria-label="Прослушать выбранный звук">▶ Пример</button>
        </span>
      </label>

      <div>
        <div class="range-heading">
          <label for="ambientInput">Фоновый эмбиент</label>
          <span class="range-value" id="ambientValue">12%</span>
        </div>
        <input type="range" id="ambientInput" min="0" max="40" step="1" value="12">
      </div>
    </section>

    <button class="start-btn" id="startBtn" type="button">Начать чтение</button>
    <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>
  </main>

  <section class="reader-screen" id="readerScreen" aria-label="Экран чтения">
    <div class="reader-progress" id="readerProgress"></div>
    <div class="word-display" id="wordDisplay" aria-live="off">
      <span class="word-before"></span><span class="word-focus"></span><span class="word-after"></span>
    </div>
    <article class="code-card" id="codeCard" hidden aria-label="Фрагмент кода">
      <h2 class="code-heading">Фрагмент кода · прочитайте целиком</h2>
      <pre class="code-content" id="codeContent"></pre>
    </article>
    <nav class="controls-overlay" id="controlsOverlay" aria-label="Управление чтением">
      <button class="btn-icon" id="rewindBtn" type="button" aria-label="Назад на 10 слов">↶ 10</button>
      <button class="btn-icon" id="pauseBtn" type="button" aria-label="Пауза">Ⅱ</button>
      <button class="btn-icon" id="forwardBtn" type="button" aria-label="Вперёд на 10 слов">10 ↷</button>
      <button class="btn-icon" id="exitBtn" type="button" aria-label="Выйти из чтения">✕</button>
    </nav>
  </section>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "speedReaderState";
      const CACHE_DB_NAME = "speedReaderCache";
      const CACHE_STORE_NAME = "documents";
      const DEFAULT_SETTINGS = { wpm: 300, theme: "oled", sound: "piano", ambient: 12 };
      const THEME_NAMES = new Set(["oled", "midnight", "grey", "paper"]);
      const SOUND_NAMES = new Set(["piano", "click", "chime", "marimba", "pulse", "off"]);

      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
      }

      const $ = (id) => document.getElementById(id);
      const fileInput = $("fileInput");
      const fileNameDisplay = $("fileName");
      const wpmInput = $("wpmInput");
      const wpmValue = $("wpmValue");
      const themeInput = $("themeInput");
      const soundInput = $("soundInput");
      const ambientInput = $("ambientInput");
      const ambientValue = $("ambientValue");
      const setupScreen = $("setupScreen");
      const readerScreen = $("readerScreen");
      const wordDisplay = $("wordDisplay");
      const wordBefore = wordDisplay.querySelector(".word-before");
      const wordFocus = wordDisplay.querySelector(".word-focus");
      const wordAfter = wordDisplay.querySelector(".word-after");
      const readerProgress = $("readerProgress");
      const codeCard = $("codeCard");
      const codeContent = $("codeContent");
      const controlsOverlay = $("controlsOverlay");
      const pauseBtn = $("pauseBtn");
      const statusMessage = $("statusMessage");
      const resumeBanner = $("resumeBanner");
      const resumeTitle = $("resumeTitle");
      const resumeDetails = $("resumeDetails");

      let words = [];
      let currentIndex = 0;
      let currentFileName = "";
      let isPlaying = false;
      let timer = null;
      let hideControlsTimer = null;
      let audioCtx = null;
      let ambientSource = null;
      let ambientGain = null;
      let ambientFilter = null;
      let savedState = readSavedState();
      let resumeRequested = false;
      let cachedDocumentAvailable = false;
      let fileLoadStarted = false;
      let touchStart = null;
      let ignoreClickUntil = 0;

      applySettings(savedState?.settings || DEFAULT_SETTINGS);
      updateResumeBanner();

      function readSavedState() {
        try {
          const value = localStorage.getItem(STORAGE_KEY);
          if (!value) return null;
          const parsed = JSON.parse(value);
          if (!parsed || typeof parsed !== "object") return null;
          const settings = parsed.settings && typeof parsed.settings === "object"
            ? parsed.settings : {};
          return {
            fileName: typeof parsed.fileName === "string" ? parsed.fileName : "",
            index: Number.isInteger(parsed.index) && parsed.index >= 0 ? parsed.index : 0,
            total: Number.isInteger(parsed.total) && parsed.total > 0 ? parsed.total : 0,
            settings: {
              wpm: clamp(Number(settings.wpm) || DEFAULT_SETTINGS.wpm, 100, 800),
              theme: THEME_NAMES.has(settings.theme) ? settings.theme : DEFAULT_SETTINGS.theme,
              sound: SOUND_NAMES.has(settings.sound) ? settings.sound : DEFAULT_SETTINGS.sound,
              ambient: clamp(Number(settings.ambient) || 0, 0, 40)
            }
          };
        } catch (error) {
          console.error("Не удалось прочитать сохранённый прогресс.", error);
          setStatus("Не удалось прочитать сохранённый прогресс в этом браузере.");
          return null;
        }
      }

      function getSettings() {
        return {
          wpm: Number(wpmInput.value),
          theme: themeInput.value,
          sound: soundInput.value,
          ambient: Number(ambientInput.value)
        };
      }

      function applySettings(settings) {
        wpmInput.value = String(settings.wpm);
        themeInput.value = settings.theme;
        soundInput.value = settings.sound;
        ambientInput.value = String(settings.ambient);
        document.documentElement.dataset.theme = settings.theme;
        document.querySelector('meta[name="theme-color"]').content =
          getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
        wpmValue.textContent = String(settings.wpm);
        ambientValue.textContent = `${settings.ambient}%`;
      }

      function saveState() {
        const state = {
          fileName: currentFileName || savedState?.fileName || "",
          index: currentFileName ? currentIndex : (savedState?.index || 0),
          total: words.length || savedState?.total || 0,
          settings: getSettings()
        };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          savedState = state;
          updateResumeBanner();
        } catch (error) {
          console.error("Не удалось сохранить прогресс чтения.", error);
          statusMessage.textContent = "Не удалось сохранить прогресс в этом браузере.";
        }
      }

      function openCacheDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(CACHE_DB_NAME, 1);
          request.onupgradeneeded = () => {
            request.result.createObjectStore(CACHE_STORE_NAME, { keyPath: "id" });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("Не удалось открыть локальный кэш."));
        });
      }

      async function cacheDocument(fileName, loadedWords) {
        const database = await openCacheDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(CACHE_STORE_NAME, "readwrite");
          transaction.objectStore(CACHE_STORE_NAME).put({
            id: STORAGE_KEY,
            fileName,
            words: loadedWords
          });
          transaction.oncomplete = () => {
            database.close();
            resolve();
          };
          transaction.onerror = () => {
            database.close();
            reject(transaction.error || new Error("Не удалось сохранить текст в локальный кэш."));
          };
          transaction.onabort = () => {
            database.close();
            reject(transaction.error || new Error("Сохранение локального кэша было прервано."));
          };
        });
      }

      async function readCachedDocument() {
        const database = await openCacheDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(CACHE_STORE_NAME, "readonly");
          const request = transaction.objectStore(CACHE_STORE_NAME).get(STORAGE_KEY);
          request.onsuccess = () => {
            database.close();
            resolve(request.result || null);
          };
          request.onerror = () => {
            database.close();
            reject(request.error || new Error("Не удалось прочитать локальный кэш."));
          };
        });
      }

      function isCachedWords(value) {
        return Array.isArray(value) && value.length > 0 && value.every((word) =>
          typeof word === "string" ||
          (word && typeof word === "object" && word.type === "code" && typeof word.text === "string"));
      }

      async function restoreCachedDocument() {
        if (!savedState?.fileName || !savedState.total) return;
        try {
          const cached = await readCachedDocument();
          if (fileLoadStarted || !cached || cached.fileName !== savedState.fileName ||
              !isCachedWords(cached.words) || cached.words.length !== savedState.total) {
            return;
          }
          words = cached.words;
          currentFileName = cached.fileName;
          cachedDocumentAvailable = true;
          updateResumeBanner();
        } catch (error) {
          console.error("Не удалось восстановить текст из локального кэша.", error);
          setStatus("Не удалось восстановить сохранённый текст. Выберите файл, чтобы продолжить.");
        }
      }

      function updateResumeBanner() {
        const resumable = savedState?.fileName && savedState.total > 0 &&
          savedState.index > 0 && savedState.index < savedState.total;
        resumeBanner.classList.toggle("visible", Boolean(resumable));
        if (resumable) {
          const percent = Math.min(99, Math.floor((savedState.index / savedState.total) * 100));
          resumeTitle.textContent = `Продолжить чтение ${savedState.fileName} (${percent}%)?`;
          resumeDetails.textContent = cachedDocumentAvailable
            ? "Текст сохранён в этом браузере — файл выбирать повторно не нужно."
            : "Выберите тот же файл, чтобы продолжить с сохранённого места.";
        }
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function setStatus(message) {
        statusMessage.textContent = message;
      }

      function normalizeText(text) {
        return text.replace(/\u00a0/g, " ").trim().split(/\s+/u).filter(Boolean);
      }

      function readMarkdown(text) {
        if (!window.marked || typeof window.marked.parse !== "function") {
          throw new Error("Не удалось загрузить обработчик Markdown. Проверьте подключение к интернету и повторите попытку.");
        }

        const parsedDocument = new DOMParser().parseFromString(
          window.marked.parse(text, { gfm: true }),
          "text/html"
        );
        const segments = [];
        let prose = "";
        const flushProse = () => {
          if (prose.trim()) segments.push(...normalizeText(prose));
          prose = "";
        };
        const visit = (node) => {
          if (node.nodeType === Node.TEXT_NODE) {
            prose += node.nodeValue || "";
            return;
          }
          if (node.nodeType !== Node.ELEMENT_NODE) return;

          const element = node;
          const tagName = element.tagName.toLowerCase();
          if (tagName === "pre") {
            flushProse();
            const code = element.querySelector("code");
            segments.push({
              type: "code",
              text: (code ? code.textContent : element.textContent).replace(/\n+$/u, "")
            });
            return;
          }
          if (tagName === "img") {
            prose += element.getAttribute("alt") || "";
            return;
          }
          if (tagName === "li") prose += "• ";
          if (tagName === "br" || tagName === "hr") {
            prose += " ";
            return;
          }

          for (const child of element.childNodes) visit(child);
          if (/^(?:p|h[1-6]|blockquote|li|ul|ol|table|tr|th|td|section|article|div)$/.test(tagName)) {
            prose += " ";
          }
        };

        for (const child of parsedDocument.body.childNodes) visit(child);
        flushProse();
        return segments;
      }

      async function readPdf(file) {
        if (!window.pdfjsLib) {
          throw new Error("Не удалось загрузить PDF.js. Проверьте подключение к интернету и повторите попытку.");
        }
        const document = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
        const segments = [];
        for (let pageNumber = 1; pageNumber <= document.numPages; pageNumber += 1) {
          const page = await document.getPage(pageNumber);
          const content = await page.getTextContent();
          const positionedItems = content.items
            .filter((item) => "str" in item && item.str.trim())
            .map((item) => ({
              text: item.str.trim(),
              x: item.transform[4],
              y: item.transform[5],
              width: item.width,
              fontSize: Math.abs(item.transform[3]) || 10
            }))
            .sort((a, b) => b.y - a.y || a.x - b.x);
          const lines = [];
          for (const item of positionedItems) {
            let line = lines.find((candidate) =>
              Math.abs(candidate.y - item.y) <= Math.max(2, item.fontSize * 0.24));
            if (!line) {
              line = { y: item.y, items: [] };
              lines.push(line);
            }
            line.items.push(item);
          }

          const pageLines = lines
            .sort((a, b) => b.y - a.y)
            .map((line) => {
              line.items.sort((a, b) => a.x - b.x);
              let text = "";
              let previous = null;
              for (const item of line.items) {
                if (previous) {
                  const gap = item.x - (previous.x + previous.width);
                  if (gap > Math.max(1.5, item.fontSize * 0.2) && !text.endsWith(" ")) {
                    text += " ";
                  }
                }
                text += item.text;
                previous = item;
              }
              return text.trim();
            })
            .filter(Boolean);

          segments.push(...splitPdfCodeBlocks(pageLines));
        }
        return segments.flatMap((segment) => segment.type === "code"
          ? [{ type: "code", text: segment.text }]
          : normalizeText(segment.text));
      }

      function isCodeLikeLine(line) {
        let score = 0;
        if (/[{}]|=>|===?|!==?|<=|>=|&&|\|\||\+\+|--|::/.test(line)) score += 2;
        if (/;/.test(line)) score += 1;
        if (/^\s*(?:\/\/|#|\/\*|\*|<\/?[a-z][^>]*>)/i.test(line)) score += 2;
        if (/\b(?:function|const|let|var|return|class|import|export|def|async|await|print|public|private|SELECT|FROM|WHERE)\b/.test(line)) score += 1;
        if (/\b[\w$]+\s*\([^)]*\)\s*[{;=]/.test(line) || /\b[\w$]+\s*=\s*[^=]/.test(line)) score += 1;
        if (/^\s*[\w$.]+\s*\([^)]*\)\s*;?\s*$/.test(line)) score += 2;
        return score >= 2;
      }

      function splitPdfCodeBlocks(lines) {
        const codeCandidate = lines.map(isCodeLikeLine);
        const codeLine = codeCandidate.map((candidate, index) =>
          candidate && ((codeCandidate[index - 1] || codeCandidate[index + 1]) ||
            /[{}]|=>|===?|!==?|<=|>=|&&|\|\||<\/?[a-z][^>]*>/i.test(lines[index])));
        const segments = [];
        let prose = [];
        let code = [];

        const flushProse = () => {
          if (prose.length) segments.push({ type: "text", text: prose.join(" ") });
          prose = [];
        };
        const flushCode = () => {
          if (code.length) segments.push({ type: "code", text: code.join("\n") });
          code = [];
        };

        lines.forEach((line, index) => {
          if (codeLine[index]) {
            flushProse();
            code.push(line);
          } else {
            flushCode();
            prose.push(line);
          }
        });
        flushCode();
        return segments;
      }

      async function loadFile(file) {
        fileLoadStarted = true;
        setStatus("");
        fileNameDisplay.textContent = file.name;
        try {
          const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
          const isMarkdown = file.type === "text/markdown" || /\.(?:md|markdown)$/i.test(file.name);
          const loadedWords = isPdf
            ? await readPdf(file)
            : isMarkdown
              ? readMarkdown(await file.text())
              : normalizeText(await file.text());
          if (!loadedWords.length) {
            throw new Error("В файле не найден текст для чтения.");
          }
          words = loadedWords;
          currentFileName = file.name;
          cachedDocumentAvailable = false;

          if (resumeRequested) {
            resumeRequested = false;
            if (savedState?.fileName === file.name && savedState.total > 0) {
              startReading(Math.min(savedState.index, words.length - 1));
            } else {
              setStatus("Имя файла не совпадает с сохранённым. Нажмите «Начать чтение», чтобы начать сначала.");
            }
          }
          saveState();
          try {
            await cacheDocument(file.name, loadedWords);
            cachedDocumentAvailable = true;
            updateResumeBanner();
          } catch (error) {
            console.error("Не удалось сохранить текст в локальный кэш.", error);
            setStatus("Прогресс сохранён, но текст не удалось кэшировать. Для продолжения потребуется снова выбрать файл.");
          }
        } catch (error) {
          console.error("Не удалось открыть файл.", error);
          setStatus(error instanceof Error ? error.message : "Не удалось открыть файл.");
          words = [];
          currentFileName = "";
        }
      }

      function ensureAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) {
            throw new Error("Этот браузер не поддерживает Web Audio API.");
          }
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch((error) => {
            console.error("Не удалось включить аудио.", error);
            setStatus("Браузер не разрешил воспроизведение звука.");
          });
        }
        return audioCtx;
      }

      function playSound(type = soundInput.value) {
        if (type === "off") return;
        try {
          const context = ensureAudioContext();
          const now = context.currentTime;
          const master = context.createGain();
          const notes = {
            piano: { frequencies: [261.63, 329.63, 392], duration: 0.19, volume: 0.07, wave: "sine" },
            click: { frequencies: [1250], duration: 0.04, volume: 0.09, wave: "triangle", sweep: 380 },
            chime: { frequencies: [1046.5, 1568], duration: 0.38, volume: 0.045, wave: "sine" },
            marimba: { frequencies: [523.25, 659.25, 783.99], duration: 0.3, volume: 0.055, wave: "triangle", step: 0.055 },
            pulse: { frequencies: [392, 493.88, 587.33], duration: 0.24, volume: 0.045, wave: "triangle", step: 0.035 }
          }[type];
          if (!notes) return;

          master.gain.setValueAtTime(notes.volume, now);
          master.connect(context.destination);
          notes.frequencies.forEach((frequency, index) => {
            const oscillator = context.createOscillator();
            const envelope = context.createGain();
            const startAt = now + (notes.step || 0) * index;
            const duration = notes.duration - (notes.step || 0) * index * 0.45;
            oscillator.type = notes.wave;
            oscillator.frequency.setValueAtTime(frequency, startAt);
            if (notes.sweep) {
              oscillator.frequency.exponentialRampToValueAtTime(notes.sweep, startAt + duration * 0.65);
            }
            envelope.gain.setValueAtTime(0.0001, now);
            envelope.gain.setValueAtTime(0.0001, startAt);
            envelope.gain.linearRampToValueAtTime(0.34 / (notes.frequencies.length > 1 ? 1.5 : 1), startAt + 0.008);
            envelope.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
            oscillator.connect(envelope);
            envelope.connect(master);
            oscillator.start(startAt);
            oscillator.stop(startAt + duration + 0.01);
          });
          master.gain.setValueAtTime(notes.volume, now);
          master.gain.exponentialRampToValueAtTime(0.0001, now + notes.duration + 0.04);
        } catch (error) {
          console.error("Не удалось воспроизвести звук.", error);
          setStatus(error instanceof Error ? error.message : "Ошибка воспроизведения звука.");
        }
      }

      function playClickSound() {
        playSound();
      }

      function renderCode(code) {
        const tokenPattern = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\b(?:const|let|var|function|return|class|import|export|from|if|else|for|while|async|await|new|true|false|null|undefined|def|print|public|private|SELECT|FROM|WHERE)\b|\b\d+(?:\.\d+)?\b|\b[A-Za-z_$][\w$]*\b)/g;
        const keywordPattern = /^(?:const|let|var|function|return|class|import|export|from|if|else|for|while|async|await|new|true|false|null|undefined|def|print|public|private|SELECT|FROM|WHERE)$/;
        const fragment = document.createDocumentFragment();
        let lastIndex = 0;
        for (const match of code.matchAll(tokenPattern)) {
          if (match.index > lastIndex) {
            fragment.append(document.createTextNode(code.slice(lastIndex, match.index)));
          }
          const token = match[0];
          const span = document.createElement("span");
          span.textContent = token;
          if (/^(?:\/\/|#|\/\*|\*)/.test(token)) span.className = "code-comment";
          else if (/^["'`]/.test(token)) span.className = "code-string";
          else if (/^\d/.test(token)) span.className = "code-number";
          else if (keywordPattern.test(token)) span.className = "code-keyword";
          else if (/^\s*\(/.test(code.slice(lastIndex + token.length))) span.className = "code-function";
          fragment.append(span);
          lastIndex = match.index + token.length;
        }
        if (lastIndex < code.length) {
          fragment.append(document.createTextNode(code.slice(lastIndex)));
        }
        codeContent.replaceChildren(fragment);
      }

      function createPinkNoiseBuffer(context) {
        const sampleRate = context.sampleRate;
        const buffer = context.createBuffer(1, sampleRate * 2, sampleRate);
        const output = buffer.getChannelData(0);
        let b0 = 0;
        let b1 = 0;
        let b2 = 0;
        let b3 = 0;
        let b4 = 0;
        let b5 = 0;
        let b6 = 0;
        for (let i = 0; i < output.length; i += 1) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.969 * b2 + white * 0.153852;
          b3 = 0.8665 * b3 + white * 0.3104856;
          b4 = 0.55 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.016898;
          output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
          b6 = white * 0.115926;
        }
        return buffer;
      }

      function startAmbient() {
        const volume = Number(ambientInput.value) / 100;
        if (!volume) return;
        try {
          const context = ensureAudioContext();
          if (!ambientSource) {
            ambientSource = context.createBufferSource();
            ambientSource.buffer = createPinkNoiseBuffer(context);
            ambientSource.loop = true;
            ambientFilter = context.createBiquadFilter();
            ambientFilter.type = "lowpass";
            ambientFilter.frequency.value = 1400;
            ambientGain = context.createGain();
            ambientGain.gain.value = 0;
            ambientSource.connect(ambientFilter);
            ambientFilter.connect(ambientGain);
            ambientGain.connect(context.destination);
            ambientSource.start();
          }
          ambientGain.gain.cancelScheduledValues(context.currentTime);
          ambientGain.gain.setTargetAtTime(volume * 0.32, context.currentTime, 0.18);
        } catch (error) {
          console.error("Не удалось запустить фоновый эмбиент.", error);
          setStatus(error instanceof Error ? error.message : "Ошибка фонового аудио.");
        }
      }

      function stopAmbient() {
        if (!audioCtx || !ambientGain) return;
        ambientGain.gain.cancelScheduledValues(audioCtx.currentTime);
        ambientGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.12);
      }

      function renderWord(index) {
        const word = words[index];
        if (!word) {
          codeCard.hidden = true;
          wordDisplay.hidden = false;
          wordBefore.textContent = "";
          wordFocus.textContent = "";
          wordAfter.textContent = "";
          return;
        }

        readerProgress.textContent = `${Math.min(index + 1, words.length)} / ${words.length}`;
        if (typeof word === "object" && word.type === "code") {
          wordDisplay.hidden = true;
          codeCard.hidden = false;
          renderCode(word.text);
          return;
        }

        codeCard.hidden = true;
        wordDisplay.hidden = false;
        const letters = Array.from(word);
        const focusIndex = Math.min(letters.length - 1, Math.floor((letters.length - 1) * 0.33));
        wordBefore.textContent = letters.slice(0, focusIndex).join("");
        wordFocus.textContent = letters[focusIndex];
        wordAfter.textContent = letters.slice(focusIndex + 1).join("");

        const availableWidth = Math.max(160, readerScreen.clientWidth - 48);
        const size = Math.min(58, Math.max(22, (availableWidth / Math.max(letters.length, 1)) / 0.64));
        wordDisplay.style.fontSize = `${size}px`;
      }

      function delayAfterWord(index) {
        return typeof words[index] === "object" && words[index].type === "code"
          ? 2600
          : 60000 / Number(wpmInput.value);
      }

      function renderNextWord() {
        if (!isPlaying) return;
        if (currentIndex >= words.length) {
          pause();
          currentIndex = words.length;
          saveState();
          return;
        }
        const displayedIndex = currentIndex;
        const item = words[displayedIndex];
        renderWord(displayedIndex);
        if (typeof item === "string") playClickSound();
        currentIndex += 1;
        saveState();
        timer = window.setTimeout(renderNextWord, delayAfterWord(displayedIndex));
      }

      function play() {
        if (!words.length || isPlaying) return;
        isPlaying = true;
        pauseBtn.textContent = "Ⅱ";
        pauseBtn.setAttribute("aria-label", "Пауза");
        startAmbient();
        showControls();
        timer = window.setTimeout(renderNextWord, 0);
        saveState();
      }

      function pause() {
        isPlaying = false;
        window.clearTimeout(timer);
        timer = null;
        pauseBtn.textContent = "▶";
        pauseBtn.setAttribute("aria-label", "Продолжить");
        stopAmbient();
        clearTimeout(hideControlsTimer);
        controlsOverlay.classList.remove("hidden");
        saveState();
      }

      function startReading(index = 0) {
        if (!words.length) {
          setStatus("Сначала выберите текстовый файл.");
          return;
        }
        currentIndex = clamp(index, 0, words.length);
        setupScreen.style.display = "none";
        readerScreen.classList.add("active");
        if (currentIndex > 0) renderWord(currentIndex - 1);
        else renderWord(0);
        play();
      }

      function jumpWords(delta) {
        if (!words.length) return;
        const target = clamp(currentIndex + delta, 0, words.length - 1);
        window.clearTimeout(timer);
        renderWord(target);
        currentIndex = target + 1;
        saveState();
        if (isPlaying) {
          timer = window.setTimeout(renderNextWord, delayAfterWord(target));
        }
      }

      function showControls() {
        controlsOverlay.classList.remove("hidden");
        clearTimeout(hideControlsTimer);
        if (isPlaying) {
          hideControlsTimer = window.setTimeout(() => {
            if (isPlaying) controlsOverlay.classList.add("hidden");
          }, 2000);
        }
      }

      function handleReaderTap(event) {
        if (Date.now() < ignoreClickUntil || event.target.closest(".controls-overlay")) return;
        showControls();
        const bounds = readerScreen.getBoundingClientRect();
        const relativeX = (event.clientX - bounds.left) / bounds.width;
        if (relativeX >= 0.2 && relativeX <= 0.8) {
          isPlaying ? pause() : play();
        }
      }

      $("chooseFileBtn").addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (file) await loadFile(file);
        fileInput.value = "";
      });

      $("startBtn").addEventListener("click", () => startReading(0));
      $("previewSoundBtn").addEventListener("click", () => {
        if (soundInput.value === "off") {
          setStatus("Выбран режим без звука.");
          return;
        }
        setStatus("");
        playSound(soundInput.value);
      });
      $("resumeBtn").addEventListener("click", () => {
        resumeRequested = true;
        if (currentFileName && currentFileName === savedState?.fileName) {
          startReading(Math.min(savedState.index, words.length - 1));
        } else {
          fileInput.click();
        }
      });
      wpmInput.addEventListener("input", () => {
        wpmValue.textContent = wpmInput.value;
        saveState();
      });
      [themeInput, soundInput, ambientInput].forEach((input) => {
        input.addEventListener("input", () => {
          if (input === themeInput) {
            document.documentElement.dataset.theme = themeInput.value;
            document.querySelector('meta[name="theme-color"]').content =
              getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
          }
          if (input === ambientInput) {
            ambientValue.textContent = `${ambientInput.value}%`;
            if (isPlaying) {
              stopAmbient();
              startAmbient();
            }
          }
          saveState();
        });
        input.addEventListener("change", saveState);
      });

      pauseBtn.addEventListener("click", () => isPlaying ? pause() : play());
      $("rewindBtn").addEventListener("click", () => jumpWords(-10));
      $("forwardBtn").addEventListener("click", () => jumpWords(10));
      $("exitBtn").addEventListener("click", () => {
        pause();
        readerScreen.classList.remove("active");
        setupScreen.style.display = "flex";
      });
      readerScreen.addEventListener("click", handleReaderTap);
      readerScreen.addEventListener("touchstart", (event) => {
        showControls();
        const touch = event.changedTouches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
      }, { passive: true });
      readerScreen.addEventListener("touchend", (event) => {
        if (!touchStart || event.target.closest(".controls-overlay")) {
          touchStart = null;
          return;
        }
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStart.x;
        const dy = touch.clientY - touchStart.y;
        touchStart = null;
        if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.25) {
          ignoreClickUntil = Date.now() + 450;
          jumpWords(dx < 0 ? -10 : 10);
        }
      }, { passive: true });
      readerScreen.addEventListener("touchcancel", () => { touchStart = null; }, { passive: true });
      window.addEventListener("resize", () => {
        if (readerScreen.classList.contains("active") && words.length) {
          renderWord(Math.max(0, currentIndex - 1));
        }
      });
      window.addEventListener("pagehide", saveState);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") saveState();
      });
      restoreCachedDocument();
    })();
  </script>
</body>
</html>
